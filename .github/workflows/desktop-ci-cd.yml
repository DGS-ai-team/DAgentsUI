name: Desktop CI/CD

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - name: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Build desktop executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Prepare packaged artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="DAgents-${{ matrix.platform.name }}-${{ github.sha }}"
          STAGE_DIR="release-stage/${ARTIFACT_NAME}"
          mkdir -p "${STAGE_DIR}"
          cp "src-tauri/target/release/DAgents" "${STAGE_DIR}/DAgents"
          chmod +x "${STAGE_DIR}/DAgents"
          if [ -f ".env.example" ]; then
            cp ".env.example" "${STAGE_DIR}/.env.example"
          fi
          (cd "${STAGE_DIR}" && zip -r "../${ARTIFACT_NAME}.zip" .)

      - name: Prepare packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactName = "DAgents-${{ matrix.platform.name }}-${{ github.sha }}"
          $stageRoot = "release-stage"
          $stageDir = Join-Path $stageRoot $artifactName
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/DAgents.exe" -Destination (Join-Path $stageDir "DAgents.exe") -Force
          if (Test-Path ".env.example") {
            Copy-Item ".env.example" -Destination (Join-Path $stageDir ".env.example") -Force
          }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath (Join-Path $stageRoot "$artifactName.zip") -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAgents-${{ matrix.platform.name }}
          path: release-stage/*.zip

