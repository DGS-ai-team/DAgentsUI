name: Desktop CI/CD (Electron)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-latest

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Verify Electron runtime
        run: pnpm exec electron --version

      - name: Prepare packaged artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="DAgents-${{ matrix.platform.name }}-${{ github.sha }}"
          STAGE_DIR="release-stage/${ARTIFACT_NAME}"
          mkdir -p "${STAGE_DIR}"
          cp -r dist "${STAGE_DIR}/dist"
          cp -r electron "${STAGE_DIR}/electron"
          cp package.json "${STAGE_DIR}/package.json"
          cp pnpm-lock.yaml "${STAGE_DIR}/pnpm-lock.yaml"
          if [ -f "README.md" ]; then
            cp "README.md" "${STAGE_DIR}/README.md"
          fi
          if [ -f ".env.example" ]; then
            cp ".env.example" "${STAGE_DIR}/.env.example"
          fi
          (cd "${STAGE_DIR}" && zip -r "../${ARTIFACT_NAME}.zip" .)

      - name: Prepare packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactName = "DAgents-${{ matrix.platform.name }}-${{ github.sha }}"
          $stageRoot = "release-stage"
          $stageDir = Join-Path $stageRoot $artifactName
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "dist" -Destination (Join-Path $stageDir "dist") -Recurse -Force
          Copy-Item "electron" -Destination (Join-Path $stageDir "electron") -Recurse -Force
          Copy-Item "package.json" -Destination (Join-Path $stageDir "package.json") -Force
          Copy-Item "pnpm-lock.yaml" -Destination (Join-Path $stageDir "pnpm-lock.yaml") -Force
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination (Join-Path $stageDir "README.md") -Force
          }
          if (Test-Path ".env.example") {
            Copy-Item ".env.example" -Destination (Join-Path $stageDir ".env.example") -Force
          }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath (Join-Path $stageRoot "$artifactName.zip") -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAgents-${{ matrix.platform.name }}
          path: release-stage/*.zip

