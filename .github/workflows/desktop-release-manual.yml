name: Desktop Release (Manual, Electron)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Manual Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-latest

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      # Windows Authenticode：仓库 Secrets 中存放 Base64 编码的 .pfx（WINDOWS_CODESIGN_PFX_BASE64）及密码（WINDOWS_CODESIGN_PFX_PASSWORD）。未配置时产出未签名 exe。
      - name: Configure Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "::notice::Building unsigned Windows portable. Set WINDOWS_CODESIGN_PFX_BASE64 + WINDOWS_CODESIGN_PFX_PASSWORD for Authenticode."
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_IDENTITY_AUTO_DISCOVERY=false"
            exit 0
          }
          $path = Join-Path $env:GITHUB_WORKSPACE "codesign-windows.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$path"

      # macOS：Developer ID Application 等 .p12 的 Base64 + 密码；未配置时 zip 内为 ad-hoc 签名。
      # 不在 if 中直接使用 secrets（部分校验器/环境会报错）；改为先写入 step output 再判断。
      - name: Detect macOS signing credentials
        id: mac_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_B64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
        run: |
          if [ -n "${P12_B64}" ]; then
            echo "has_p12=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_p12=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import macOS code signing certificate
        if: runner.os == 'macOS' && steps.mac_signing.outputs.has_p12 == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}

      - name: Build Electron portable (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: pnpm exec electron-builder --win portable --publish never

      - name: Build Electron portable (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: pnpm exec electron-builder --mac zip --publish never

      - name: Upload desktop portable
        uses: actions/upload-artifact@v4
        with:
          name: DAgents-${{ matrix.platform.name }}
          path: |
            electron-release/*.exe
            electron-release/*.zip

